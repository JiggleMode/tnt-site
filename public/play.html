<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Play · The TnT Brother Games</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{--aqua:#00e5e5;--ink:#04161b;--panel:#071f26;--line:rgba(255,255,255,.1);--txt:#e9fbfb;--mute:#9cc3c7;--coral:#ff4d6d}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%;background:var(--ink);color:var(--txt);font:16px/1.5 Tenorite,Figtree,system-ui,sans-serif;overflow:hidden}
.bar{height:56px;display:flex;align-items:center;gap:12px;padding:0 12px;background:var(--panel);border-bottom:1px solid var(--line)}
.bar a,.bar button{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--txt);font:700 14px inherit;font-family:inherit;text-decoration:none;cursor:pointer}
.bar a:focus-visible,.bar button:focus-visible{outline:3px solid var(--aqua);outline-offset:2px}
.name{flex:1;font-weight:900;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.clock{font-variant-numeric:tabular-nums;font-weight:700;color:var(--aqua);font-size:15px;white-space:nowrap}
.clock i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--coral);margin-right:6px;vertical-align:1px}
.clock.idle i{background:var(--mute)}
#stage{position:absolute;top:56px;left:0;right:0;bottom:0}
iframe{width:100%;height:100%;border:0;display:block;background:#000}
.msg{position:absolute;inset:0;display:grid;place-items:center;padding:24px;text-align:center}
.msg div{max-width:420px}
.msg h1{font-size:28px;margin:0 0 8px;font-weight:900}
.msg p{color:var(--mute);margin:0 0 20px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 22px;border-radius:14px;background:var(--aqua);color:var(--ink);font-weight:800;text-decoration:none;border:0;cursor:pointer;font-family:inherit;font-size:16px}
.spin{width:40px;height:40px;border-radius:50%;border:4px solid var(--line);border-top-color:var(--aqua);margin:0 auto 16px;animation:r 1s linear infinite}
@keyframes r{to{transform:rotate(360deg)}}
@media(max-width:520px){.bar .lbl{display:none}}
</style>
</head>
<body>
<div class="bar">
  <a href="./#games" aria-label="Back to all games">←<span class="lbl">Games</span></a>
  <span class="name" id="name">Loading…</span>
  <span class="clock idle" id="clock" title="Time played this session"><i></i>0:00</span>
  <button type="button" id="fs" aria-label="Full screen">⛶<span class="lbl">Full screen</span></button>
</div>
<div id="stage"><div class="msg"><div><div class="spin"></div><p>Loading your game…</p></div></div></div>

<script type="module">
import { firebaseConfig, FIREBASE_VERSION, PAYMENT } from "./config.js";
import { games } from "./catalog.js";
{
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const gameId = new URLSearchParams(location.search).get('g');
const game = games.find(g => g.id === gameId);
const show = (title, text, btn) => { $('stage').innerHTML = `<div class="msg"><div><h1>${esc(title)}</h1><p>${esc(text)}</p>${btn || ''}</div></div>`; };

const IDLE_AFTER = 60 * 1000;   // no input for a minute = idle, not counted
const FLUSH_EVERY = 20 * 1000;  // save progress every 20 seconds
const MAX_STEP = 60;            // the database accepts at most this many new seconds per save

const start = async () => {
  if (!game) return show('Game not found', 'That game link looks wrong.', '<a class="btn" href="./">See all games</a>');
  $('name').textContent = game.name;
  document.title = `${game.name} · The TnT Brother Games`;
  if (!firebaseConfig.apiKey) return show('Not set up yet', 'The game player isn\'t switched on yet.', '<a class="btn" href="./">Back to games</a>');

  const V = `https://www.gstatic.com/firebasejs/${FIREBASE_VERSION}/`;
  let F;
  try { F = Object.assign({}, ...await Promise.all(['app', 'auth', 'firestore', 'storage'].map(m => import(`${V}firebase-${m}.js`)))); }
  catch (e) { return show('Couldn\'t connect', 'Check your internet connection and try again.', '<button class="btn" onclick="location.reload()">Try again</button>'); }
  const app = F.initializeApp(firebaseConfig);
  const auth = F.getAuth(app), db = F.getFirestore(app);

  const user = await new Promise(res => { const off = F.onAuthStateChanged(auth, u => { off(); res(u); }); });
  if (!user) return show('Please sign in', `Sign in on the games page to play ${game.name}.`, '<a class="btn" href="./">Go to sign in</a>');

  const me = await F.getDoc(F.doc(db, 'users', user.uid));
  if (!((me.data() || {}).unlocked || []).includes(game.id)) {
    return show('Unlock this game first', `${game.name} isn't on your account yet.`, `<a class="btn" href="./#${esc(game.id)}">Unlock ${esc(game.name)}</a>`);
  }

  /* load the game file (only owners can read it) */
  let html = null;
  if (PAYMENT.gameFilesInStorage) {
    try { html = new TextDecoder().decode(await F.getBytes(F.ref(F.getStorage(app), `games/${game.id}.html`), 20 * 1024 * 1024)); }
    catch (e) {
      if (e.code !== 'storage/object-not-found') return show('Couldn\'t load the game', 'Please try again in a moment.', '<button class="btn" onclick="location.reload()">Try again</button>');
    }
  }
  if (!html) {
    /* game file not uploaded yet: open it on its own page (play time can't be tracked there) */
    try {
      const link = await F.getDoc(F.doc(db, 'gameLinks', game.id));
      const data = { url: link.exists() && link.data().url };
      if (!data.url || !/^https:\/\//.test(data.url)) throw new Error('no link');
      F.addDoc(F.collection(db, 'events'), { uid: user.uid, type: 'launch_external', gameId: game.id, at: F.serverTimestamp() }).catch(() => {});
      return show(game.name, 'This game opens on its own page.', `<a class="btn" href="${esc(data.url)}">Play ${esc(game.name)} ▶</a>`);
    } catch (e) { return show('Couldn\'t load the game', 'Please try again in a moment.', '<button class="btn" onclick="location.reload()">Try again</button>'); }
  }

  /* ---- play session tracking ---- */
  const sref = F.doc(F.collection(db, 'sessions'));
  const ua = navigator.userAgent;
  const platform = /iPhone|iPad|iPod/.test(ua) ? 'iOS' : /Android/.test(ua) ? 'Android' : /Windows/.test(ua) ? 'Windows' : /Mac/.test(ua) ? 'Mac' : /CrOS/.test(ua) ? 'ChromeOS' : /Linux/.test(ua) ? 'Linux' : 'Other';
  await F.setDoc(sref, {
    uid: user.uid, gameId: game.id,
    startedAt: F.serverTimestamp(), lastSeenAt: F.serverTimestamp(), endedAt: null,
    activeSeconds: 0, inputs: 0,
    device: { platform, touch: matchMedia('(pointer: coarse)').matches, w: screen.width, h: screen.height },
    tz: Intl.DateTimeFormat().resolvedOptions().timeZone || ''
  });

  let active = 0, sent = 0, inputs = 0, lastInput = Date.now(), lastTick = performance.now(), ended = false;
  const touch = () => { lastInput = Date.now(); inputs++; };
  const watch = w => ['keydown', 'pointerdown', 'touchstart', 'wheel', 'pointermove'].forEach(ev => w.addEventListener(ev, ev === 'pointermove' ? () => { lastInput = Date.now(); } : touch, { passive: true, capture: true }));
  watch(window);

  const fmt = s => { s = Math.floor(s); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60; return (h ? h + ':' + String(m).padStart(2, '0') : m) + ':' + String(x).padStart(2, '0'); };
  setInterval(() => {
    const now = performance.now(), dt = (now - lastTick) / 1000; lastTick = now;
    const playing = !document.hidden && Date.now() - lastInput < IDLE_AFTER;
    if (playing && dt < 5) active += dt;
    $('clock').innerHTML = `<i></i>${fmt(active)}`;
    $('clock').classList.toggle('idle', !playing);
  }, 1000);

  const flush = (extra = {}) => {
    const next = Math.min(Math.floor(active), sent + MAX_STEP);
    if (next === sent && !extra.endedAt) return Promise.resolve();
    sent = next;
    return F.updateDoc(sref, { activeSeconds: next, inputs, lastSeenAt: F.serverTimestamp(), ...extra }).catch(() => {});
  };
  setInterval(() => { if (!ended) flush(); }, FLUSH_EVERY);
  document.addEventListener('visibilitychange', () => { if (document.hidden && !ended) flush(); });
  const end = () => { if (ended) return; ended = true; flush({ endedAt: F.serverTimestamp() }); };
  addEventListener('pagehide', end);

  /* ---- start the game ---- */
  const fr = document.createElement('iframe');
  fr.title = game.name;
  fr.allow = 'fullscreen; autoplay; gamepad; accelerometer; gyroscope';
  fr.addEventListener('load', () => { try { watch(fr.contentWindow); fr.contentWindow.focus(); } catch (e) {} });
  fr.srcdoc = html;
  $('stage').innerHTML = ''; $('stage').appendChild(fr);
  $('fs').addEventListener('click', () => { const el = $('stage'); (el.requestFullscreen ? el.requestFullscreen() : Promise.reject()).catch(() => {}); });
};
start();
}
</script>
</body>
</html>
